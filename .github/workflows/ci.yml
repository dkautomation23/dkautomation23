name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The profile README is the first page anyone sees, and it is a page of
    # links to other repositories. Those get renamed. Weekly is often enough to
    # catch it before a visitor does.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Every link in the profile resolves
        run: python .github/check_links.py README.md
