name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The profile README is the first page anyone sees, and it is a page of
    # links to other repositories. Those get renamed. Weekly is often enough to
    # catch it before a visitor does.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# The default token can write; a build and a test run only need to read.
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Every link in the profile resolves
        run: python .github/check_links.py README.md
